[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvopt"
version = "0.1.0"
description = "Architecture scaffold for KV cache management experiments"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kvopt-profile-derive = "kvopt.profiling.cli:main"
kvopt-formal-campaign = "kvopt.workload.phase2_formal:main"
kvopt-formal-run = "kvopt.workload.phase2_formal_runner:main"
kvopt-level-b-seam-generate = "kvopt.workload.phase2_level_b_validation:main"
kvopt-level-b-seam-report = "kvopt.profiling.level_b_validation:main"
kvopt-h2-calibration-generate = "kvopt.workload.phase2_h2_calibration:main"
kvopt-h2-calibration-run = "kvopt.workload.phase2_h2_calibration_runner:main"
kvopt-h2-calibration-report = "kvopt.profiling.h2_calibration:main"
kvopt-h2-isolated-calibration-generate = "kvopt.workload.phase2_h2_isolated_calibration:main"
kvopt-h2-isolated-calibration-report = "kvopt.profiling.h2_isolated_calibration:main"
kvopt-m4-offline = "kvopt.costaware.cli:main"
kvopt-phase2g-a1-compare = "kvopt.costaware.a1_compare:main"
kvopt-phase2g-a2-compare = "kvopt.costaware.a2_compare:main"
kvopt-phase2g-gate2-review = "kvopt.profiling.phase2g_gate2_review:main"
kvopt-phase2b-fidelity-run = "kvopt.workload.phase2b_runner:main"
kvopt-phase2b-fidelity-report = "kvopt.profiling.phase2b_fidelity:main"
kvopt-phase2b-evidence-pack = "kvopt.profiling.phase2b_evidence:main"
kvopt-continuum-workload-convert = "kvopt.workload.continuum_source_audit:main"
kvopt-continuum-w1a-convert = "kvopt.workload.continuum_w1a_conversion:main"
kvopt-continuum-w1a-run = "kvopt.workload.continuum_w1a_runner:main"
kvopt-continuum-w1a-report = "kvopt.workload.continuum_w1a_report:main"
kvopt-continuum-w1b-replay = "kvopt.workload.continuum_w1b_replay:main"
kvopt-continuum-w1b-smoke = "kvopt.workload.continuum_w1b_smoke:main"
kvopt-continuum-w1b-fidelity = "kvopt.workload.continuum_w1b_fidelity:main"
kvopt-continuum-w1b-cost-audit = "kvopt.workload.continuum_w1b_cost_audit:main"
kvopt-continuum-w1b-profile = "kvopt.workload.continuum_w1b_profile:main"
kvopt-continuum-w1b-profile-point = "kvopt.workload.continuum_w1b_profile_runner:main"
kvopt-continuum-w1b-profile-assemble = "kvopt.workload.continuum_w1b_profile_assemble:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
