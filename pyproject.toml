[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvopt"
version = "0.1.0"
description = "Architecture scaffold for KV cache management experiments"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kvopt-profile-derive = "kvopt.profiling.cli:main"
kvopt-formal-campaign = "kvopt.workload.phase2_formal:main"
kvopt-formal-run = "kvopt.workload.phase2_formal_runner:main"
kvopt-level-b-seam-generate = "kvopt.workload.phase2_level_b_validation:main"
kvopt-level-b-seam-report = "kvopt.profiling.level_b_validation:main"
kvopt-m4-offline = "kvopt.costaware.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
